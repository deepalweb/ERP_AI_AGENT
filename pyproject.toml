[project]
name = "erp-ai-agent"
version = "0.1.0"
description = "AI Business Intelligence Agent for ERP data"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "openai",
    "mcp",
    "sqlalchemy",
    "psycopg[binary]",
    "alembic",
    "pydantic",
    "pydantic-settings",
    "python-dotenv",
    "apscheduler",
    "filelock>=3.16,<4",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
    "ruff",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
# real_backend tests hit the live, read-only reporting database and take
# minutes -- excluded from the default run so `pytest`/`pytest -q` stays
# fast and deterministic. Run them explicitly with:
#   pytest -m real_backend tests/test_real_backend_integration.py
markers = ["real_backend: exercises the real reporting database (slow, needs network access)"]
addopts = "-m 'not real_backend'"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*", "frontend*", "analytics*", "mcp_server*"]
